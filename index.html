<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạm biệt 2025 – Chào 2026 🎆</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            animation: glow 2s infinite alternate;
        }
        .year {
            font-size: 5em;
            color: #00e6ff;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #fff; }
            to { text-shadow: 0 0 25px #00e6ff; }
        }
    </style>
</head>
<body>
    <div>
        <h1>🎉 Tạm biệt 2025 🎉</h1>
        <div class="year">Welcome 2026</div>
        <p>Chúc bạn năm mới nhiều may mắn và thành công ✨</p>
        <p>— Phan Bảo Khang —</p>
    </div>
</body>
</html>
