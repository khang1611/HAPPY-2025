<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạm biệt 2025 – Chào 2026 🎆</title>
<style>
body{
    margin:0;
    height:100vh;
    background: radial-gradient(circle at bottom, #020111, #000);
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}
canvas{
    position:fixed;
    top:0;
    left:0;
}
.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}
h1{font-size:3em;}
#countdown{
    font-size:3em;
    color:#00e6ff;
}
input,button{
    padding:12px;
    margin:8px;
    width:260px;
    border:none;
    border-radius:6px;
    font-size:16px;
}
button{
    background:#00e6ff;
    cursor:pointer;
}
#login{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}
#main{display:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="center">
        <h1>🎇 Chào mừng năm 2026 🎇</h1>
        <input id="name" placeholder="Họ và tên">
        <input id="dream" placeholder="Ước mơ năm 2026">
        <br>
        <button onclick="start()">Bắt đầu</button>
    </div>
</div>

<!-- MAIN -->
<canvas id="fireworks"></canvas>
<div id="main" class="center">
    <h1 id="welcome"></h1>
    <p id="wish"></p>
    <div id="countdown"></div>
    <p>— Phan Bảo Khang —</p>
</div>

<script>
function start(){
    const name=document.getElementById("name").value;
    const dream=document.getElementById("dream").value;
    if(!name||!dream){alert("Vui lòng nhập đầy đủ");return;}
    document.getElementById("login").style.display="none";
    document.getElementById("main").style.display="block";
    document.getElementById("welcome").innerText=`🎉 Chào ${name}!`;
    document.getElementById("wish").innerText=`Ước mơ 2026: ${dream}`;
}

// COUNTDOWN
const target=new Date("Jan 1, 2026 00:00:00").getTime();
setInterval(()=>{
    const now=new Date().getTime();
    const d=target-now;
    const cd=document.getElementById("countdown");
    if(d<=0){cd.innerHTML="🎆 CHÀO 2026 🎆";return;}
    const h=Math.floor((d%(1000*60*60*24))/(1000*60*60));
    const m=Math.floor((d%(1000*60*60))/(1000*60));
    const s=Math.floor((d%(1000*60))/1000);
    cd.innerHTML=`${h}h ${m}m ${s}s`;
},1000);

// FIREWORKS
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
function firework(){
    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height/2;
    for(let i=0;i<60;i++){
        ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
        ctx.beginPath();
        ctx.arc(x,y,Math.random()*3,0,Math.PI*2);
        ctx.fill();
    }
}
setInterval(()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    firework();
},500);
</script>

</body>
</html>
